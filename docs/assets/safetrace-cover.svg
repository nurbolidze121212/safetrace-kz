<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">SafeTrace KZ — от сообщения к доказательствам</title>
  <desc id="desc">Инструмент проверки скрытого продвижения азартных игр. OCR, маршрут ссылок, объяснимые признаки, решение человека.</desc>
