  <text x="58" y="180" font-family="Arial,sans-serif" font-size="86" font-weight="700" letter-spacing="-3" fill="#fff">SafeTrace KZ</text>
  <text x="63" y="250" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#ecf3fc">От сообщения к доказательствам.</text>
  <text x="63" y="301" font-family="Arial,sans-serif" font-size="24" fill="#a9bdd5">Распознать. Проследить. Объяснить.</text>
  <path d="M65 366H748" stroke="#36546d"/>
  <g font-family="Arial,sans-serif"><text x="64" y="411" font-size="18" fill="#7ae2bb">МӘТІН / СІЛТЕМЕ / СУРЕТ</text><text x="64" y="447" font-size="19" fill="#c0cfdf">RU + KK · настоящий OCR · источники каждого вывода</text><text x="64" y="511" font-size="15" fill="#93a8c2">Исследовательский прототип · Приоритет проверки ≠ вероятность нарушения</text></g>
