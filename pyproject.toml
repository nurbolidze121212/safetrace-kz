[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# These scripts set isolated storage/offline configuration before importing the app.
"scripts/evaluate.py" = ["E402"]
"scripts/prepare_demo.py" = ["E402"]
"scripts/ocr_probe.py" = ["E402"]
"scripts/ocr_checks.py" = ["E402"]
"scripts/offline_check.py" = ["E402"]
