services:
  safetrace:
    build: .
    platform: linux/amd64
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      SAFETRACE_OFFLINE: "1"
      SAFETRACE_DATA_DIR: /app/data
    volumes:
      - safetrace-data:/app/data
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
volumes:
  safetrace-data:
