name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libgomp1 fonts-dejavu-core
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m ruff check backend tests scripts
      - uses: actions/cache@v4
        with:
          path: models
          key: ocr-${{ runner.os }}-${{ hashFiles('models-manifest.json') }}
      - run: python scripts/prepare_models.py
      - run: python -m pytest -q
        env:
          SAFETRACE_OFFLINE: '1'
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint && npm test && npm run build
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 90
      - name: Verify new text analysis and OCR
        run: python3 scripts/smoke_http.py --base-url http://127.0.0.1:8765
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
