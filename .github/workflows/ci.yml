name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish verified ready image to GHCR
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libgomp1 fonts-dejavu-core
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m ruff check backend tests scripts
      - uses: actions/cache@v4
        with:
          path: models
          key: ocr-${{ runner.os }}-${{ hashFiles('models-manifest.json') }}
      - run: python scripts/prepare_models.py
      - run: python -m pytest -q
        env:
          SAFETRACE_OFFLINE: '1'
          SAFETRACE_TEST_REDIS_URL: redis://127.0.0.1:6379/0
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint && npm test && npm run build
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - run: docker compose -f compose.yaml -f compose.build.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.build.yaml build
      - run: docker compose -f compose.yaml -f compose.build.yaml up -d --wait --wait-timeout 90
      - name: Verify new text analysis and OCR
        run: python3 scripts/smoke_http.py --base-url http://127.0.0.1:8765
      - name: Measure real 1, 2 and 4 worker curve
        if: github.event_name == 'workflow_dispatch'
        run: |
          bench_dir="${RUNNER_TEMP}/safetrace-queue"
          mkdir -p "$bench_dir"
          lscpu > "$bench_dir/cpu.txt"
          free -m > "$bench_dir/memory.txt"
          for workers in 1 2 4; do
            docker compose -f compose.yaml -f compose.build.yaml up -d --scale worker=$workers --wait --wait-timeout 120
            python3 scripts/benchmark_queue_v5.py --workers "$workers" --output "$bench_dir/workers-$workers.json"
          done
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: real-queue-benchmark
          path: ${{ runner.temp }}/safetrace-queue
      - name: Publish prepared image
        if: github.event_name == 'workflow_dispatch' && inputs.publish_image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag safetrace-local:development ghcr.io/nurbolidze121212/safetrace-kz:3.0.0
          docker tag safetrace-local:development ghcr.io/nurbolidze121212/safetrace-kz:sha-${{ github.sha }}
          docker push ghcr.io/nurbolidze121212/safetrace-kz:3.0.0
          docker push ghcr.io/nurbolidze121212/safetrace-kz:sha-${{ github.sha }}
      - if: always()
        run: docker compose -f compose.yaml -f compose.build.yaml logs --no-color
      - if: always()
        run: docker compose -f compose.yaml -f compose.build.yaml down
